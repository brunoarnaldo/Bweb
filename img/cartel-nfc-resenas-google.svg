<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 700" width="600" height="700" role="img" aria-labelledby="t">
  <title id="t">Cartel NFC de reseñas de Google: Deje una reseña, toque aquí</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5F7"/>
      <stop offset="1" stop-color="#E6E8EC"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1220" flood-opacity=".14"/>
    </filter>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <polygon id="star" points="0,-17 4.11,-5.66 16.17,-5.25 6.66,2.16 9.99,13.75 0,7 -9.99,13.75 -6.66,2.16 -16.17,-5.25 -4.11,-5.66"/>
  </defs>

  <!-- sombra en el piso -->
  <ellipse cx="290" cy="668" rx="250" ry="16" fill="#0B1220" opacity=".16" filter="url(#blur)"/>

  <!-- base del exhibidor -->
  <polygon points="96,612 512,612 486,660 62,660" fill="url(#base)" stroke="#E1E4E8" stroke-width="1.5"/>
  <polygon points="62,660 486,660 486,667 62,667" fill="#D9DCE1"/>

  <!-- panel -->
  <g filter="url(#soft)">
    <rect x="92" y="40" width="420" height="578" rx="20" fill="url(#panel)" stroke="#E5E7EB" stroke-width="1.5"/>
  </g>
  <rect x="92" y="40" width="420" height="578" rx="20" fill="url(#gloss)" opacity=".7"/>

  <!-- título -->
  <text x="302" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#111111" textLength="330" lengthAdjust="spacingAndGlyphs">DEJE UNA RESEÑA</text>

  <!-- anillo con colores de Google -->
  <g fill="none" stroke-width="12">
    <circle cx="302" cy="330" r="122" stroke="#FBBC05" stroke-dasharray="191.64 574.92" stroke-dashoffset="0"/>
    <circle cx="302" cy="330" r="122" stroke="#34A853" stroke-dasharray="191.64 574.92" stroke-dashoffset="-191.64"/>
    <circle cx="302" cy="330" r="122" stroke="#4285F4" stroke-dasharray="191.64 574.92" stroke-dashoffset="-383.28"/>
    <circle cx="302" cy="330" r="122" stroke="#EA4335" stroke-dasharray="191.64 574.92" stroke-dashoffset="-574.92"/>
  </g>

  <!-- ícono NFC: celular con ondas -->
  <g transform="translate(302 282)" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-13" y="-24" width="26" height="48" rx="5" transform="rotate(-10)"/>
    <line x1="-5" y1="-18" x2="4" y2="-19.6" transform="rotate(-10)"/>
    <path d="M-22 -30 a8 8 0 0 1 6 -7"/>
    <path d="M-28 -32 a15 15 0 0 1 10 -12"/>
    <path d="M-34 -34 a22 22 0 0 1 15 -17"/>
  </g>
  <text x="292" y="246" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111">NFC</text>

  <text x="302" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#222222" letter-spacing="1">TOQUE AQUÍ</text>

  <text x="302" y="402" text-anchor="middle" font-family="'Product Sans', 'Google Sans', Arial, Helvetica, sans-serif" font-size="54" font-weight="500" letter-spacing="-1"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan></text>

  <!-- estrellas -->
  <g fill="#FBBC05">
    <use xlink:href="#star" href="#star" transform="translate(222 510) scale(1.15)"/>
    <use xlink:href="#star" href="#star" transform="translate(262 504) scale(1.15)"/>
    <use xlink:href="#star" href="#star" transform="translate(302 500) scale(1.15)"/>
    <use xlink:href="#star" href="#star" transform="translate(342 496) scale(1.15)"/>
    <use xlink:href="#star" href="#star" transform="translate(382 492) scale(1.15)"/>
  </g>

  <!-- barra inferior -->
  <g>
    <rect x="148" y="556" width="78" height="9" fill="#EA4335"/>
    <rect x="226" y="553" width="78" height="9" fill="#34A853"/>
    <rect x="304" y="550" width="78" height="9" fill="#4285F4"/>
    <rect x="382" y="547" width="78" height="9" fill="#FBBC05"/>
  </g>
</svg>
